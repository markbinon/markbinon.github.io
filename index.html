      animation-delay: -9s;

    .glow-lg  { box-shadow: 0 0 30px rgb(var(--p400) / .35); }

      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 1.5rem;
      border: 1px solid rgb(var(--edge) / .18);
      box-shadow:
        0 20px 50px rgb(var(--shadow) / calc(.6 * var(--sa))),
        inset 0 1px 1.5px rgb(255 255 255 / .35),
        inset 0 -1px 1px rgb(var(--a2) / .2);
      z-index: 10;
    }

    .liquid-glass-card {
      position: relative;
      background: linear-gradient(135deg, rgb(var(--tint) / calc(.07 * var(--ga))) 0%, rgb(var(--tint) / calc(.015 * var(--ga))) 100%);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      contain: layout style;
      border-radius: 1.25rem;
      border: 1px solid rgb(var(--edge) / .12);
      box-shadow:
        0 10px 30px rgb(var(--shadow) / calc(.45 * var(--sa))),

      background: linear-gradient(135deg, rgb(var(--tint) / calc(.14 * var(--ga))) 0%, rgb(var(--tint) / calc(.04 * var(--ga))) 100%);
      border-color: rgb(var(--p400) / .5);
      transform: translateY(-2px);
      box-shadow:
        0 18px 40px rgb(var(--shadow) / calc(.55 * var(--sa))),
        0 0 25px rgb(var(--p400) / .25),
        inset 0 1px 1px rgb(255 255 255 / .4);
    }
    }

    button, a { -webkit-tap-highlight-color: transparent; user-select: none; }

    .glass-btn {

      box-shadow:

        inset 0 1px 1px rgb(255 255 255 / .3),
        inset 0 -1px 1px rgb(var(--a2) / .15);

    }
    @media (hover: hover) {

      background: rgb(var(--tint) / calc(.12 * var(--ga)));
    }
    }

      background: linear-gradient(135deg, rgb(var(--p400) / .45) 0%, rgb(var(--a2) / .35) 100%) !important;
      border: 1px solid rgb(255 255 255 / .5) !important;

    .switch {

          { num: 3, time: "12:05–13:35", start: "12:05", end: "13:35", name: "Физическая культура", room: "Спортзал", teacher: "" },
          { num: 4, time: "13:45–15:15", start: "13:45", end: "15:15", name: "Разработка и прототипирование цифровых систем", room: "ауд. 22-209", teacher: "Почекунина Т.Б." },
          { num: 5, time: "15:25–16:55", start: "15:25", end: "16:55", name: "Элементы высшей математики", room: "ауд. 21-21", teacher: "Перетолчина Ю.Н." }
        ],
        "Вторник": [
          { num: 4, time: "13:45–15:15", start: "13:45", end: "15:15", name: "Основы проектирования цифровой техники", room: "ауд. 22-214", teacher: "Кириченко К.В." },
          { num: 5, time: "15:25–16:55", start: "15:25", end: "16:55", name: "Основы проектирования цифровой техники", room: "ауд. 22-216", teacher: "Кириченко К.В." },
          { num: 6, time: "17:05–18:35", start: "17:05", end: "18:35", name: "Основы проектирования цифровой техники", room: "ауд. 22-216", teacher: "Кириченко К.В." }
        ],
        "Среда": [
          { num: 2, time: "9:55–11:25", start: "09:55", end: "11:25", name: "Информационные технологии", room: "ауд. 22-209", teacher: "Чинская И.А." },
          { num: 3, time: "12:05–13:35", start: "12:05", end: "13:35", name: "Иностранный язык в профессиональной деятельности", room: "п/г 1: 21-17 | п/г 2: 21-35", teacher: "п/г 1 Бухарова Н.А. / п/г 2 Родионова И.П." }
        ],
        "Четверг": [
          { num: 1, time: "8:15–9:45", start: "08:15", end: "09:45", name: "Информационные технологии", room: "ауд. 22-209", teacher: "Чинская И.А." },
          { num: 2, time: "9:55–11:25", start: "09:55", end: "11:25", name: "Безопасность жизнедеятельности", room: "ауд. 21-45а", teacher: "Плюснина А.В." },
          { num: 3, time: "12:05–13:35", start: "12:05", end: "13:35", name: "Основы электротехники и электронной техники", room: "ауд. 21-27", teacher: "Черкашенина Т.В." },
          { num: 4, time: "13:45–15:15", start: "13:45", end: "15:15", name: "Основы электротехники и электронной техники", room: "ауд. 21-27", teacher: "Черкашенина Т.В." }
        ],
        "Пятница": [
          { num: 1, time: "8:15–9:45", start: "08:15", end: "09:45", name: "Основы электротехники и электронной техники", room: "ауд. 21-27", teacher: "Черкашенина Т.В." },
          { num: 2, time: "9:55–11:25", start: "09:55", end: "11:25", name: "Безопасность жизнедеятельности", room: "ауд. 21-36", teacher: "Плюснина О.М." },
          { num: 3, time: "12:05–13:35", start: "12:05", end: "13:35", name: "Безопасность жизнедеятельности", room: "ауд. 21-45а", teacher: "Плюснина А.В." },
          { num: 4, time: "13:45–15:15", start: "13:45", end: "15:15", name: "Основы проектирования цифровой техники", room: "ауд. 22-209", teacher: "Кириченко К.В." }
        ],
        "Суббота": [
          { num: 1, time: "8:15–9:45", start: "08:15", end: "09:45", name: "Разработка и прототипирование цифровых систем", room: "ауд. 22-210", teacher: "Почекунина Т.Б." },
          { num: 2, time: "9:55–11:25", start: "09:55", end: "11:25", name: "Разработка и прототипирование цифровых систем", room: "ауд. 22-210", teacher: "Почекунина Т.Б." },
          { num: 3, time: "12:05–13:35", start: "12:05", end: "13:35", name: "Физическая культура", room: "Спортзал", teacher: "" }
        ]
      }
    };

    const days = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
    
    let currentWeek = "top";
    let currentDay = "Понедельник";
    let realTodayIndex = -1;
    let realWeekType = "top";

    // Опорная точка: неделя, начинающаяся в понедельник 26.10.2026, — верхняя.
    // Дальше недели чередуются: верхняя, нижняя, верхняя, ... (смена в понедельник).
    const ANCHOR_MONDAY = new Date(2026, 9, 26);

    function getWeekType(d) {
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const monday = new Date(date);
      monday.setDate(date.getDate() - ((date.getDay() + 6) % 7));
      const weeks = Math.round((monday - ANCHOR_MONDAY) / (7 * 86400000));
      return (((weeks % 2) + 2) % 2 === 0) ? "top" : "bottom";
    }

    function isNowInPair(startTimeStr, endTimeStr) {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const [sH, sM] = startTimeStr.split(':').map(Number);
      const [eH, eM] = endTimeStr.split(':').map(Number);

      const startMinutes = sH * 60 + sM;
      const endMinutes = eH * 60 + eM;

      return nowMinutes >= startMinutes && nowMinutes <= endMinutes;
    }

    function detectRealDateTime() {
      const now = new Date();
      realWeekType = getWeekType(now);
      currentWeek = realWeekType;
      updateWeekStatus();

      const dayOfWeek = now.getDay();
      if (dayOfWeek >= 1 && dayOfWeek <= 6) {
        realTodayIndex = dayOfWeek - 1;
        currentDay = days[realTodayIndex];
      } else {
        realTodayIndex = -1;
        currentDay = "Понедельник";
      }
    }

    function updateWeekStatus() {
      const label = realWeekType === "top" ? "верхняя" : "нижняя";
      document.getElementById("week-status-text").textContent = `Сейчас ${label} неделя`;
      document.getElementById("dot-top").classList.toggle("hidden", realWeekType !== "top");
      document.getElementById("dot-bottom").classList.toggle("hidden", realWeekType !== "bottom");
    }

    function initDaysNav() {
      const nav = document.getElementById("days-nav");
      nav.innerHTML = days.map((day, idx) => {
        const isRealToday = idx === realTodayIndex;
        return `
          <button 
            id="day-btn-${day}" 
            onclick="setDay('${day}')"
            class="flex-1 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 flex items-center justify-center gap-2 active:scale-95 ${day === currentDay ? 'glass-btn-active' : 'glass-btn text-rose-200/70 hover:text-rose-100'}"
          >
            ${isRealToday ? '<span class="w-2 h-2 rounded-full bg-pink-400 animate-pulse glow-dot"></span>' : ''}
            ${day}
          </button>
        `;
      }).join('');
    }

    function setWeek(week) {
      currentWeek = week;
      const btnTop = document.getElementById("btn-top");
      const btnBottom = document.getElementById("btn-bottom");

      if (week === 'top') {
        btnTop.className = "glass-btn-active flex-1 md:flex-initial px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 active:scale-95";
        btnBottom.className = "text-rose-200/70 hover:text-rose-100 flex-1 md:flex-initial px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 active:scale-95";
      } else {
        btnBottom.className = "glass-btn-active flex-1 md:flex-initial px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 active:scale-95";
        btnTop.className = "text-rose-200/70 hover:text-rose-100 flex-1 md:flex-initial px-4 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 active:scale-95";
      }

      renderSchedule(true);
    }

    function setDay(day) {
      currentDay = day;
      
      days.forEach(d => {
        const btn = document.getElementById(`day-btn-${d}`);
        if (btn) {
          if (d === currentDay) {
            btn.className = "flex-1 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold glass-btn-active transition-all duration-300 flex items-center justify-center gap-2 active:scale-95";
          } else {
            btn.className = "flex-1 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold glass-btn text-rose-200/70 hover:text-rose-100 transition-all duration-300 flex items-center justify-center gap-2 active:scale-95";
          }
        }
      });

      renderSchedule(true);
    }

    let lastRenderSig = "";
    function renderSchedule(animate = false) {
      const container = document.getElementById("schedule-container");
      const titleEl = document.getElementById("current-day-title");
      const countEl = document.getElementById("pairs-count");

      const isToday = realTodayIndex >= 0 && days[realTodayIndex] === currentDay && currentWeek === realWeekType;

      // Пропускаем перерисовку, если ничего не изменилось (минутный тик)
      const dayPairs = scheduleData[currentWeek][currentDay] || [];
      const sig = [currentWeek, currentDay, isToday, dayPairs.map(it => (isToday && isNowInPair(it.start, it.end)) ? 1 : 0).join("")].join("|");
      if (sig === lastRenderSig) return;
      lastRenderSig = sig;

      titleEl.innerHTML = `
        ${currentDay}
        ${isToday ? '<span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-pink-500/20 text-pink-300 border border-pink-400/40 glow-sm">Сегодня</span>' : ''}
      `;

      const pairs = scheduleData[currentWeek][currentDay] || [];
      countEl.textContent = `${pairs.length} ${getPairDeclension(pairs.length)}`;

      if (pairs.length === 0) {
        container.innerHTML = `
          <div class="liquid-glass rounded-2xl p-8 text-center text-rose-200/60 ${animate ? 'card-in' : ''}">
            <svg class="w-10 h-10 mx-auto mb-2 opacity-40 text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Занятий в этот день нет
          </div>
        `;
        return;
      }

      container.innerHTML = pairs.map((item, idx) => {
        const isOngoing = isToday && isNowInPair(item.start, item.end);

        return `
          <div class="liquid-glass-card ${animate ? 'card-in' : ''} p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4 ${isOngoing ? 'ring-2 ring-rose-400/80 bg-rose-950/30 glow-lg' : ''}" style="--i:${idx}">
            <div class="flex items-start gap-3.5">
              <!-- Pair Number Tag -->
              <div class="flex-shrink-0 w-11 h-11 rounded-xl ${isOngoing ? 'bg-pink-500/30 border-pink-400/60 text-pink-200' : 'bg-pink-500/10 border-pink-300/20 text-rose-100'} border flex flex-col items-center justify-center font-bold">
                <span class="text-[9px] uppercase tracking-wider opacity-60 font-normal">Пара</span>
                <span class="text-base leading-none">${item.num}</span>
              </div>

              <!-- Subject Info -->
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="text-base font-semibold text-rose-50 leading-snug break-words">${item.name}</h3>
                  ${isOngoing ? '<span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-pink-500/30 text-pink-200 border border-pink-400/50"><span class="w-1.5 h-1.5 rounded-full bg-pink-300 animate-ping"></span>Идёт сейчас</span>' : ''}
                </div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 text-xs sm:text-sm text-rose-200/70">
                  ${item.teacher ? `
                    <span class="flex items-center gap-1">
                      <svg class="w-3.5 h-3.5 text-pink-300/60 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                      ${item.teacher}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- Time & Room Info -->
            <div class="flex md:flex-col items-center md:items-end justify-between pt-2 md:pt-0 border-t md:border-t-0 border-pink-200/10 text-xs sm:text-sm">
              <div class="flex items-center gap-1.5 ${isOngoing ? 'text-pink-200 bg-pink-500/30 border-pink-400/50' : 'text-rose-100 bg-pink-500/10 border-pink-300/20'} font-medium border px-2.5 py-1 rounded-lg">
                <svg class="w-3.5 h-3.5 text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${item.time}
              </div>
              ${item.room ? `
                <div class="flex items-center gap-1 text-rose-200/70 md:mt-1.5 font-normal text-xs sm:text-sm">
                  <svg class="w-3.5 h-3.5 text-pink-300/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  ${item.room}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function getPairDeclension(count) {
      if (count === 1) return 'пара';
      if (count >= 2 && count <= 4) return 'пары';
      return 'пар';
    }

    // ===== Settings: themes + liquid glass =====
    const THEMES = [
      { id: 'sakura',   name: 'Сакура',  bg: '#0d060a', c1: '#f472b6', c2: '#e11d48' },
      { id: 'midnight', name: 'Полночь', bg: '#060914', c1: '#818cf8', c2: '#38bdf8' },
      { id: 'ocean',    name: 'Океан',   bg: '#041014', c1: '#22d3ee', c2: '#0d9488' },
      { id: 'forest',   name: 'Лес',     bg: '#050e08', c1: '#4ade80', c2: '#a3e635' },
      { id: 'sunset',   name: 'Закат',   bg: '#120804', c1: '#fb923c', c2: '#dc2626' },
      { id: 'amethyst', name: 'Аметист', bg: '#0b0613', c1: '#c084fc', c2: '#f472b6' },
      { id: 'cloud',    name: 'Облако',  bg: '#eef1fa', c1: '#6366f1', c2: '#f472b6', light: true }
    ];
    const DEFAULT_SETTINGS = { theme: 'sakura', glass: true };
    let settings = { ...DEFAULT_SETTINGS };

    function loadSettings() {
      try {
        const st = JSON.parse(localStorage.getItem('ksk-settings') || '{}');
        if (THEMES.some(t => t.id === st.theme)) settings.theme = st.theme;
        if (typeof st.glass === 'boolean') settings.glass = st.glass;
      } catch (e) {}
    }
    function saveSettings() {
      try { localStorage.setItem('ksk-settings', JSON.stringify(settings)); } catch (e) {}
    }

    function applySettings() {
      const root = document.documentElement;
      const t = THEMES.find(x => x.id === settings.theme) || THEMES[0];
      root.dataset.theme = t.id;
      root.dataset.glass = settings.glass ? 'on' : 'off';
      root.style.colorScheme = t.light ? 'light' : 'dark';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t.bg);

      document.querySelectorAll('.theme-card').forEach(card => {
        card.setAttribute('aria-pressed', card.dataset.themeId === t.id ? 'true' : 'false');
      });
      const sw = document.getElementById('glass-switch');
      if (sw) sw.setAttribute('aria-checked', settings.glass ? 'true' : 'false');
    }

    function renderThemeGrid() {
      const grid = document.getElementById('theme-grid');
      grid.innerHTML = THEMES.map(t => `
        <button type="button" class="theme-card" data-theme-id="${t.id}" aria-pressed="false" aria-label="Тема ${t.name}">
          <span class="theme-preview" style="background:${t.bg}">
            <span class="tp-blob" style="background:linear-gradient(135deg,${t.c1},${t.c2})"></span>
            <span class="tp-bar" style="background:${t.light ? 'rgba(30,27,75,.12)' : 'rgba(255,255,255,.14)'}"></span>
            <span class="tp-pill" style="background:linear-gradient(90deg,${t.c1},${t.c2})"></span>
            <span class="theme-check"><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></span>
          </span>
          <span class="text-sm font-semibold text-rose-50 px-0.5">${t.name}</span>
        </button>
      `).join('');
      grid.querySelectorAll('.theme-card').forEach(card => {
        card.addEventListener('click', () => {
          settings.theme = card.dataset.themeId;
          saveSettings();
          applySettings();
        });
      });
    }

    function openSettings() {
      document.getElementById('settings-overlay').classList.add('open');
      document.documentElement.classList.add('modal-open');
      document.getElementById('settings-close').focus();
    }
    function closeSettings() {
      document.getElementById('settings-overlay').classList.remove('open');
      document.documentElement.classList.remove('modal-open');
      document.getElementById('settings-btn').focus();
    }

    function initSettings() {
      loadSettings();
      renderThemeGrid();
      applySettings();

      document.getElementById('settings-btn').addEventListener('click', openSettings);
      document.getElementById('settings-close').addEventListener('click', closeSettings);
      document.getElementById('settings-backdrop').addEventListener('click', closeSettings);
      document.getElementById('glass-switch').addEventListener('click', () => {
        settings.glass = !settings.glass;
        saveSettings();
        applySettings();
      });
      document.getElementById('settings-reset').addEventListener('click', () => {
        settings = { ...DEFAULT_SETTINGS };
        saveSettings();
        applySettings();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('settings-overlay').classList.contains('open')) closeSettings();
      });
    }

    // Auto-Initialization on page open
    window.addEventListener('DOMContentLoaded', () => {
      initSettings();
      detectRealDateTime();
      setWeek(currentWeek);
      initDaysNav();
      renderSchedule(true);

      // Recalculate schedule every minute
      const tick = () => {
        const prevWeek = realWeekType, prevDay = realTodayIndex;
        const now = new Date();
        realWeekType = getWeekType(now);
        const dow = now.getDay();
        realTodayIndex = (dow >= 1 && dow <= 6) ? dow - 1 : -1;
        updateWeekStatus();
        if (prevWeek !== realWeekType || prevDay !== realTodayIndex) {
          currentWeek = realWeekType;
          if (realTodayIndex >= 0) currentDay = days[realTodayIndex];
          initDaysNav();
          setWeek(currentWeek);
        } else {
          renderSchedule();
        }
      };
      setInterval(() => { if (!document.hidden) tick(); }, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    });
  </script>
