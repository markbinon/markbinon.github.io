    // Helper: ISO Week Calculation
    function getWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    function isNowInPair(startTimeStr, endTimeStr) {
      const now = new Date();
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const [sH, sM] = startTimeStr.split(':').map(Number);
      const [eH, eM] = endTimeStr.split(':').map(Number);

      const startMinutes = sH * 60 + sM;
      const endMinutes = eH * 60 + eM;

      return nowMinutes >= startMinutes && nowMinutes <= endMinutes;
    }

    function detectRealDateTime() {
      const now = new Date();
      const weekNum = getWeekNumber(now);
      
      realWeekType = (weekNum % 2 === 0) ? "bottom" : "top";
      currentWeek = realWeekType;

      const dayOfWeek = now.getDay();
      if (dayOfWeek >= 1 && dayOfWeek <= 6) {
        realTodayIndex = dayOfWeek - 1;
        currentDay = days[realTodayIndex];
      } else {
        realTodayIndex = -1;
        currentDay = "Понедельник";
      }
    }

        container.innerHTML = `
          <div class="liquid-glass rounded-2xl p-8 text-center text-rose-200/60">
            <svg class="w-10 h-10 mx-auto mb-2 opacity-40 text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Занятий в этот день нет
          </div>
        `;
        return;
      }

      container.innerHTML = pairs.map(item => {
        const isOngoing = isToday && isNowInPair(item.start, item.end);

        return `
          <div class="liquid-glass-card p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4 ${isOngoing ? 'ring-2 ring-rose-400/80 bg-rose-950/30 shadow-[0_0_30px_rgba(244,114,182,0.35)]' : ''}">
            <div class="flex items-start gap-3.5">
              <!-- Pair Number Tag -->
              <div class="flex-shrink-0 w-11 h-11 rounded-xl ${isOngoing ? 'bg-pink-500/30 border-pink-400/60 text-pink-200' : 'bg-pink-500/10 border-pink-300/20 text-rose-100'} border flex flex-col items-center justify-center font-bold">
                <span class="text-[9px] uppercase tracking-wider opacity-60 font-normal">Пара</span>
                <span class="text-base leading-none">${item.num}</span>
              </div>

              <!-- Subject Info -->
              <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="text-base font-semibold text-rose-50 leading-snug break-words">${item.name}</h3>
                  ${isOngoing ? '<span class="inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-full bg-pink-500/30 text-pink-200 border border-pink-400/50"><span class="w-1.5 h-1.5 rounded-full bg-pink-300 animate-ping"></span>Идёт сейчас</span>' : ''}
                </div>
                <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 text-xs sm:text-sm text-rose-200/70">
                  ${item.teacher ? `
                    <span class="flex items-center gap-1">
                      <svg class="w-3.5 h-3.5 text-pink-300/60 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                      ${item.teacher}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- Time & Room Info -->
            <div class="flex md:flex-col items-center md:items-end justify-between pt-2 md:pt-0 border-t md:border-t-0 border-pink-200/10 text-xs sm:text-sm">
              <div class="flex items-center gap-1.5 ${isOngoing ? 'text-pink-200 bg-pink-500/30 border-pink-400/50' : 'text-rose-100 bg-pink-500/10 border-pink-300/20'} font-medium border px-2.5 py-1 rounded-lg">
                <svg class="w-3.5 h-3.5 text-pink-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                ${item.time}
              </div>
              ${item.room ? `
                <div class="flex items-center gap-1 text-rose-200/70 md:mt-1.5 font-normal text-xs sm:text-sm">
                  <svg class="w-3.5 h-3.5 text-pink-300/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                  ${item.room}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function getPairDeclension(count) {
      if (count === 1) return 'пара';
      if (count >= 2 && count <= 4) return 'пары';
      return 'пар';
    }

    // Auto-Initialization on page open
    window.addEventListener('DOMContentLoaded', () => {
      detectRealDateTime();
      setWeek(currentWeek);
      initDaysNav();
      renderSchedule();

      // Recalculate schedule every minute
      setInterval(renderSchedule, 60000);
    });
  </script>
</body>
</html>
